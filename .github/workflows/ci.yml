name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm pack --dry-run
      - name: Verify against a separate Pi 1.5.1 host
        if: matrix.node == '22.19.0'
        run: |
          npm install --prefix "$RUNNER_TEMP/omt-pi-host" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.1
          node --experimental-strip-types test/host-compatibility.ts "$RUNNER_TEMP/omt-pi-host/node_modules/@earendil-works/pi-coding-agent"
